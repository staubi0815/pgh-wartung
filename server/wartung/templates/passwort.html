{% extends "basis.html" %}{% block titel %}Passwort ändern{% endblock %}
{% block inhalt %}
<div class="karte schmal">
  <h1>Passwort ändern</h1>
  {% if fehler %}<p class="fehler">{{ fehler }}</p>{% endif %}
  <form method="post" action="/konto/passwort">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="email" value="{{ ich.email }}" autocomplete="username">
    <label>Bisheriges Passwort <input type="password" name="alt" autocomplete="current-password" required></label>
    <label>Neues Passwort <input type="password" name="neu" autocomplete="new-password" minlength="12" required></label>
    <label>Wiederholen <input type="password" name="neu2" autocomplete="new-password" minlength="12" required></label>
    <button>Speichern</button>
  </form>
</div>
{% endblock %}
