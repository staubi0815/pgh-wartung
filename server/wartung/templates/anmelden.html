{% extends "basis.html" %}{% block titel %}Anmelden{% endblock %}
{% block inhalt %}
<div class="karte schmal">
  <h1>Anmelden</h1>
  {% if request.query_params.get('hinweis') == 'passwort_gesetzt' %}<p class="ok">Passwort gespeichert – bitte neu anmelden.</p>{% endif %}
  {% if fehler %}<p class="fehler">{{ fehler }}</p>{% endif %}
  <form method="post" action="/anmelden">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>E-Mail <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
    <label>Passwort <input type="password" name="passwort" autocomplete="current-password" required></label>
    <button>Anmelden</button>
  </form>
</div>
{% endblock %}
