# Automatische Prüfung: bei jedem Hochladen und jedem Pull Request laufen alle Tests auf einem frischen Rechner von
# GitHub – unabhängig vom Rechner, auf dem entwickelt wurde. Ergebnis: grüner oder roter Haken am Commit/Pull Request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # wie auf dem Server (LXC 192, Debian 12)
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-test.txt
      - name: Alle Tests (inkl. Prüfung, ob die Diagramme in docs/00 aktuell sind)
        run: python -m pytest -q
